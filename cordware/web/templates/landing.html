<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Applications</title>
  <style>
    :root { color-scheme: light dark; --fg: #1f2328; --muted: #59636e; --bg: #ffffff; --line: #d1d9e0; --link: #0969da; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #f0f6fc; --muted: #9198a1; --bg: #0d1117; --line: #3d444d; --link: #4493f8; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 36rem; margin: 3rem auto; padding: 0 1rem; }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    li { border-bottom: 1px solid var(--line); }
    li a { display: block; padding: 0.75rem 0; color: var(--link); text-decoration: none; font-weight: 600; }
    li a:hover, li a:focus { text-decoration: underline; }
    .empty { color: var(--muted); }
    footer { margin-top: 2rem; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Applications</h1>
    {% if links %}
      <ul>
        {% for title, href in links %}
          <li><a href="{{ href }}">{{ title }}</a></li>
        {% endfor %}
      </ul>
    {% else %}
      <p class="empty">No applications are running here.</p>
    {% endif %}
    <footer><a href="/.auth/logout">Sign out</a></footer>
  </main>
</body>
</html>
