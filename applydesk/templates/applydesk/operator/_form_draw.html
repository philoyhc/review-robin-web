{# The application form drawn as an applicant sees it (segment AD1B):
   one renderer for the Form page's Preview and the preview tab.
   applydeskDrawForm(body, form) takes a snapshot, as
   applydeskFormSnapshot() or sample_data.form_snapshot give it. Text
   goes in by textContent only. #}
<script type="application/json" id="fb-people">{{ people | tojson }}</script>
<script>
(function () {
  // Who each Select people pool holds (sample_data.people_pools): the
  // scaffold's stand-in for a directory search through Graph (AD4).
  var POOLS = JSON.parse(document.getElementById("fb-people").textContent);
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  var uid = 0;
  var POOL_NAMES = { institution: "the institution", pool: "the reviewer pool", interviewers: "the interviewers" };
  function poolName(key) { return key.indexOf("panel:") === 0 ? key.slice(6) : (POOL_NAMES[key] || POOL_NAMES.institution); }
  // A box of people: each comma-separated name or email found in the
  // pool becomes a pill; what is not found stays in the box, said why.
  function people(c, id, label) {
    // A pool this exercise has no roster for reads as Institution-wide,
    // as the card's own menu shows it.
    var key = POOLS[c.pool] ? c.pool : "institution";
    var members = POOLS[key] || [];
    var lo = /^\d+$/.test(c.min) ? parseInt(c.min, 10) : 0;
    var hi = /^\d+$/.test(c.max) ? parseInt(c.max, 10) : 0;
    var box = el("div", "tokens");
    box.setAttribute("role", "group");
    box.setAttribute("aria-labelledby", id + "-l");
    var input = el("input", "token-input");
    input.type = "text";
    input.autocomplete = "off";
    input.placeholder = "Name or email; separate several with commas";
    box.appendChild(input);
    // Always rendered, so a screen reader hears each change.
    var err = el("p", "fb-pv-err");
    err.id = id + "-e";
    err.setAttribute("role", "status");
    function say(text) { err.textContent = text; err.classList.remove("is-bad"); }
    function chosen() { return Array.prototype.map.call(box.querySelectorAll(".token"), function (t) { return t.dataset.email; }); }
    function full() { return hi > 0 && chosen().length >= hi; }
    function sync() { input.hidden = full(); }
    function pill(name, email) {
      var t = el("span", "token", name);
      t.dataset.email = email;
      var x = el("button", "token-x", "×");
      x.type = "button";
      x.setAttribute("aria-label", "Remove " + name);
      x.addEventListener("click", function () { t.remove(); sync(); say(name + " removed."); input.focus(); });
      t.appendChild(x);
      box.insertBefore(t, input);
    }
    function find(text) {
      var q = text.toLowerCase();
      return members.filter(function (m) { return m[0].toLowerCase() === q || m[1].toLowerCase() === q; });
    }
    var busy = false;
    // Each finished entry: a pill if it names one person in the pool;
    // otherwise it stays in the box with the reason. Once the box is
    // full, whatever else was typed is dropped and named, found or not,
    // so nothing is left in a hidden box.
    function take(final) {
      if (busy) return;
      busy = true;
      var focused = document.activeElement === input;
      var parts = input.value.split(",");
      var tail = final ? "" : parts.pop().replace(/^\s+/, "");
      var left = [], said = [], added = [], dropped = [];
      parts.forEach(function (raw) {
        var text = raw.trim();
        if (!text) return;
        var hits = find(text);
        if (hits.length > 1) { left.push(text); said.push("More than one " + text + ": use the email."); return; }
        if (!hits.length) { left.push(text); said.push("Not found in " + poolName(key) + ": " + text + "."); return; }
        if (chosen().indexOf(hits[0][1]) >= 0) { said.push("Already chosen: " + hits[0][0] + "."); return; }
        if (full()) { dropped.push(text); return; }
        pill(hits[0][0], hits[0][1]);
        added.push(hits[0][0]);
      });
      if (full()) {
        var extra = left.concat(dropped, tail.trim() ? [tail.trim()] : []);
        if (extra.length) said = ["At most " + hi + (hi === 1 ? " person" : " people") + "; not added: " + extra.join(", ") + "."];
        left = []; tail = "";
      }
      var bad = said.length > 0;
      if (added.length) said.unshift("Added " + added.join(", ") + ".");
      // Unfinished text stays after what was not found; a finished entry
      // left behind keeps its comma only while typing goes on.
      input.value = final ? left.join(", ") : left.concat([tail]).join(", ");
      err.textContent = said.join(" ");
      err.classList.toggle("is-bad", bad);
      sync();
      if (input.hidden && focused) box.querySelector(".token:last-of-type .token-x").focus();
      busy = false;
    }
    input.addEventListener("input", function () { if (input.value.indexOf(",") >= 0) take(false); });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); take(true); }
      else if (e.key === "Backspace" && !input.value) {
        var last = box.querySelectorAll(".token");
        if (last.length) { var gone = last[last.length - 1]; say(gone.firstChild.textContent + " removed."); gone.remove(); sync(); }
      }
    });
    input.addEventListener("blur", function () { if (input.value.trim()) take(true); });
    var unit = (c.max || c.min) === "1" ? " person" : " people";
    var hint = lo && hi ? (lo === hi ? lo + unit : lo + " to " + hi + unit) : hi ? "up to " + hi + unit : lo ? "at least " + lo + unit : "people";
    var note = el("p", "fb-pv-help", "Choose " + hint + " from " + poolName(key) + ".");
    note.id = id + "-n";
    var wrap = el("div");
    wrap.appendChild(note); wrap.appendChild(box); wrap.appendChild(err);
    return wrap;
  }
  function field(c) {
    var t = c.type, wrap = el("div", "fb-pv-field");
    if (t === "text") {
      wrap.appendChild(el("h4", "fb-pv-title", c.label || "Untitled text"));
      if (c.help) wrap.appendChild(el("p", "fb-pv-help", c.help));
      return wrap;
    }
    var id = "fb-pv-" + (++uid);
    var lab = el("label", "fb-pv-label", c.label || "Untitled question");
    lab.htmlFor = id;
    if (c.required) lab.appendChild(el("span", "fb-pv-req", " (required)"));
    wrap.appendChild(lab);
    if (c.help) { var h = el("p", "fb-pv-help", c.help); h.id = id + "-h"; wrap.appendChild(h); }
    if (c.shown) wrap.appendChild(el("p", "fb-pv-seen", "Reviewers see your answer."));
    var input;
    if (t === "string") {
      var max = /^\d+$/.test(c.max) ? parseInt(c.max, 10) : 0;
      input = el(max > 0 && max <= 200 ? "input" : "textarea", "fc-in");
      if (input.tagName === "TEXTAREA") { input.rows = 3; input.setAttribute("data-fit-box", ""); }
      if (max > 0) input.maxLength = max;
    } else if (t === "integer" || t === "decimal") {
      input = el("input", "fc-in fb-pv-num");
      input.type = "number";
      ["min", "max", "step"].forEach(function (k) { if (c[k]) input.setAttribute(k, c[k]); });
      if (t === "decimal" && !c.step) input.step = "any";
    } else if (t === "people") {
      input = people(c, id, c.label || "Untitled question");
    } else if (t === "list") {
      input = el("div", "fb-pv-opts");
      input.setAttribute("role", "group");
      c.options.split(",").map(function (o) { return o.trim(); }).filter(Boolean).forEach(function (o) {
        var l = el("label", "fb-pv-opt"), box = el("input");
        box.type = c.exclusive ? "radio" : "checkbox";
        box.name = id;
        l.appendChild(box); l.appendChild(document.createTextNode(" " + o));
        input.appendChild(l);
      });
      if (!input.children.length) input.appendChild(el("p", "muted", "No options yet."));
    } else {
      var k = c.kept;
      input = el("div", "fb-pv-photo");
      input.setAttribute("role", "group");
      var frame = el("span", "fb-pv-frame");
      if (k) frame.style.aspectRatio = k[0] + " / " + k[1];
      input.appendChild(frame);
      input.appendChild(el("span", "muted", "Choose a photo and frame it here" + (k ? " (kept " + k[0] + " × " + k[1] + ")." : ".")));
    }
    if (t === "people") {
      // The label names the box's own input; help, the count and any
      // "not found" describe it.
      var typed = input.querySelector(".token-input");
      typed.id = id;
      lab.id = id + "-l";
      if (c.required) typed.setAttribute("aria-required", "true");
      typed.setAttribute("aria-describedby", (c.help ? id + "-h " : "") + id + "-n " + id + "-e");
      wrap.appendChild(input);
      return wrap;
    }
    if (input.tagName === "INPUT" || input.tagName === "TEXTAREA") {
      input.id = id;
      if (c.required) input.required = true;
    } else {
      lab.htmlFor = ""; lab.id = id; input.setAttribute("aria-labelledby", id);
      if (c.required) input.setAttribute("aria-required", "true");
    }
    if (c.help) input.setAttribute("aria-describedby", id + "-h");
    wrap.appendChild(input);
    return wrap;
  }

  window.applydeskDrawForm = function (body, form) {
    if (window.applydeskUnfitBoxes) window.applydeskUnfitBoxes(body);
    body.textContent = "";
    body.appendChild(el("h2", "fb-pv-form", form.title || "Untitled form"));
    if (form.description) body.appendChild(el("p", "fb-pv-help", form.description));
    var page = 1;
    body.appendChild(el("p", "fb-pv-page fb-pv-first", "Page 1"));
    form.cards.forEach(function (c) {
      if (c.kind === "pagebreak") { page += 1; body.appendChild(el("p", "fb-pv-page", "Page " + page)); }
      else if (c.kind === "section") body.appendChild(el("h3", "fb-pv-section", c.label || "Untitled section"));
      else body.appendChild(field(c));
    });
    if (window.applydeskFitBoxes) window.applydeskFitBoxes(body);
  };
})();
</script>
