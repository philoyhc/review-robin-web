{# A name withheld until asked for (author, 2026-11-07): a student on no
   formal plan and with no active flag. `name` is the name as it would
   show, link included. #}
{% macro withheld(name) %}<details class="reveal"><summary><span class="subtle">No formal plan</span> <span class="reveal-cta" data-when="closed">Show name</span><span class="reveal-cta" data-when="open">Hide name</span></summary><span class="strong">{{ name }}</span></details>{% endmacro %}
