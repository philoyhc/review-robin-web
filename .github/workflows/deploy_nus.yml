# TEMPORARY, MANUAL workflow to test deploying to the NUS Azure host.
#
# workflow_dispatch ONLY — there is deliberately NO `push` trigger, so
# merging this file deploys nothing. It runs only when you dispatch it from
# the Actions tab, and only once the NUS-scoped secrets + variable exist:
#   secrets:  NUS_AZURE_CLIENT_ID, NUS_AZURE_TENANT_ID,
#             NUS_AZURE_SUBSCRIPTION_ID, NUS_DATABASE_URL
#   variable: NUS_WEBAPP_NAME  (the provisioned Web App name)
#
# Mirrors the personal deploy workflow (build -> migrate -> deploy) but
# targets NUS via NUS-scoped credentials, so it coexists with the personal
# deploy during cutover. See docs/deployment_nus.md §6.4.
#
# When the NUS host becomes primary, either promote this to an `on: push`
# deploy (and retire the personal workflow) or fold it back into the primary.

name: Deploy to NUS Azure (manual test)

on:
  workflow_dispatch:
    inputs:
      run_migrate:
        description: "Run alembic migrations against NUS Postgres. Untick if the DB isn't reachable from a GitHub-hosted runner (run migrations out-of-band instead — see docs/deployment_nus.md §5)."
        type: boolean
        default: true

concurrency:
  group: deploy-nus
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create antenv and install dependencies
        run: |
          python -m venv --copies antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app-nus
          path: |
            app/
            alembic/
            alembic.ini
            requirements.txt
            pyproject.toml
            antenv/
          include-hidden-files: true

  migrate:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.run_migrate }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alembic migrations against NUS Postgres
        env:
          DATABASE_URL: ${{ secrets.NUS_DATABASE_URL }}
        run: alembic upgrade head

  deploy:
    runs-on: ubuntu-latest
    needs: [build, migrate]
    # Deploy when the build succeeded and migrate either succeeded or was
    # intentionally skipped (run_migrate=false). Never deploy if a migrate
    # that actually ran failed.
    if: >-
      ${{ always()
          && needs.build.result == 'success'
          && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app-nus

      - name: Login to Azure (NUS tenant, OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NUS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NUS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NUS_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to NUS Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.NUS_WEBAPP_NAME }}
          slot-name: "Production"
          package: "."
