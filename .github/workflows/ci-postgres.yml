name: CI - Postgres

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  changes:
    # Which lane this run needs: tools/ci_lanes.py, guide/segment_22A_ci_lanes.md.
    # Anything it cannot decide, and every push to main, is "full".
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # A pull request checks out its merge commit, whose first parent is
          # the base: HEAD^1..HEAD is exactly what the PR changes. --no-renames
          # lists a moved file's old path too, so it is classified as well.
          fetch-depth: 2

      - name: Classify the change
        id: lane
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only --no-renames HEAD^1 HEAD > changed.txt || : > changed.txt
          else
            : > changed.txt
          fi
          result=$(python3 tools/ci_lanes.py --event "$EVENT" < changed.txt || echo "lane=full")
          echo "$result" >> "$GITHUB_OUTPUT"
          echo "CI - Postgres ${result} ($(wc -l < changed.txt) changed paths)" >> "$GITHUB_STEP_SUMMARY"

  postgres:
    needs: changes
    # Skipped for a prose-only pull request; a failed classifier still runs it.
    if: ${{ !cancelled() && needs.changes.outputs.lane != 'prose' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rrw_app
          POSTGRES_PASSWORD: rrw_app
          POSTGRES_DB: rrw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rrw_app -d rrw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://rrw_app:rrw_app@localhost:5432/rrw

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Apply migrations (upgrade head)
        run: alembic upgrade head

      - name: Round-trip migrations (downgrade base + upgrade head)
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Run pytest against Postgres
        # The browser tests serve the app from their own SQLite file, so they
        # add nothing here; they run in ci.yml (guide/archive/browser_test.md).
        # The suite reads only TEST_DATABASE_URL, never DATABASE_URL, because
        # it drops the schema it is pointed at.
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pytest -q --ignore=tests/browser
