name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  changes:
    # Which lane this run needs: tools/ci_lanes.py, guide/segment_22A_ci_lanes.md.
    # Anything it cannot decide, and every push to main, is "full".
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # A pull request checks out its merge commit, whose first parent is
          # the base: HEAD^1..HEAD is exactly what the PR changes. --no-renames
          # lists a moved file's old path too, so it is classified as well.
          fetch-depth: 2

      - name: Classify the change
        id: lane
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only --no-renames HEAD^1 HEAD > changed.txt || : > changed.txt
          else
            : > changed.txt
          fi
          result=$(python3 tools/ci_lanes.py --event "$EVENT" < changed.txt || echo "lane=full")
          echo "$result" >> "$GITHUB_OUTPUT"
          echo "CI ${result} ($(wc -l < changed.txt) changed paths)" >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: changes
    # Runs unless the change is prose only; a failed classifier still runs it.
    if: ${{ !cancelled() && needs.changes.outputs.lane != 'prose' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Run tests
        # tests/browser/ fails rather than skips without a browser here
        # (guide/archive/browser_test.md).
        env:
          RRW_REQUIRE_BROWSER: "1"
        run: pytest -n auto

  prose:
    # A prose-only pull request: the unit tests (the doc gates live there)
    # plus each test elsewhere that reads prose. No Chromium, no ruff.
    needs: changes
    if: ${{ needs.changes.outputs.lane == 'prose' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run the prose lane's tests
        run: |
          read -r -a targets <<< "$(python3 tools/ci_lanes.py --prose-tests)"
          pytest -n auto "${targets[@]}"
