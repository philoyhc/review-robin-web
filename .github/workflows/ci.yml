name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Run tests
        # tests/browser/ fails rather than skips without a browser here
        # (guide/browser_test.md).
        env:
          RRW_REQUIRE_BROWSER: "1"
        run: pytest -n auto
