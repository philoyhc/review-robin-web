name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  changes:
    # Which lane this run needs: tools/ci_lanes.py, guide/segment_22A_ci_lanes.md.
    # Anything it cannot decide, and every push to main, is "full".
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # A pull request checks out its merge commit, whose first parent is
          # the base: HEAD^1..HEAD is exactly what the PR changes. --no-renames
          # lists a moved file's old path too, so it is classified as well.
          fetch-depth: 2

      - name: Classify the change
        id: lane
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only --no-renames HEAD^1 HEAD > changed.txt || : > changed.txt
          else
            : > changed.txt
          fi
          result=$(python3 tools/ci_lanes.py --event "$EVENT" < changed.txt || echo "lane=full")
          echo "$result" >> "$GITHUB_OUTPUT"
          echo "CI ${result} ($(wc -l < changed.txt) changed paths)" >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: changes
    # Runs unless the change is prose or Residential only; a failed
    # classifier still runs it.
    if: ${{ !cancelled() && needs.changes.outputs.lane != 'prose' && needs.changes.outputs.lane != 'residential' }}
    # Pinned, not ubuntu-latest: that moved to 26.04 on 2026-11-05 and the
    # pinned Playwright (1.56) installs no Chromium there. Unpin with a
    # Playwright that supports it.
    runs-on: ubuntu-24.04
    # Three shards in parallel, by folder (segment 22H Item 2), sized on
    # 4 cores: unit with lint, format and type check about 1.5 min,
    # integration about 1.7 min, browser about 1.2 min. Together they run
    # every testpaths root in pyproject.toml exactly once, which
    # tests/unit/test_ci_shards.py checks.
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: unit
            pytest_args: "tests cordware/tests residentialapps/tests utilityapps/tests --ignore=tests/integration --ignore=tests/browser"
          - name: integration
            pytest_args: "tests/integration"
          - name: browser
            pytest_args: "tests/browser"
    name: test (${{ matrix.shard.name }})

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # The unit shard needs it too: three of residentialapps/tests'
      # files drive a browser.
      - name: Install Chromium for the browser tests
        if: matrix.shard.name != 'integration'
        run: python -m playwright install --with-deps chromium

      - name: Lint
        if: matrix.shard.name == 'unit'
        run: ruff check .

      - name: Format check
        if: matrix.shard.name == 'unit'
        run: ruff format --check .

      # Application code and tests (`[tool.pyright]`, segments 22C, 22D); setup-python's
      # interpreter is on PATH, so pyright resolves the installed packages.
      - name: Type check
        if: matrix.shard.name == 'unit'
        run: pyright

      - name: Run tests
        # A browser test fails rather than skips without a browser here
        # (guide/archive/browser_test.md).
        env:
          RRW_REQUIRE_BROWSER: "1"
          PYTEST_ARGS: ${{ matrix.shard.pytest_args }}
        run: |
          # Word-split on purpose: PYTEST_ARGS is a list of paths and flags.
          # shellcheck disable=SC2086
          pytest -n auto $PYTEST_ARGS

  prose:
    # A prose-only pull request: the unit tests (the doc gates live there)
    # plus each test elsewhere that reads prose. No Chromium, no ruff.
    needs: changes
    if: ${{ needs.changes.outputs.lane == 'prose' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run the prose lane's tests
        run: |
          read -r -a targets <<< "$(python3 tools/ci_lanes.py --prose-tests)"
          pytest -n auto "${targets[@]}"

  residential:
    # A pull request touching only prose and residentialapps/: Residential's
    # tests, the host's (import boundaries, mounting) and the prose lane's,
    # with lint. Chromium for Residential's own browser tests, which fail
    # rather than skip without one here, as RRW's do in the full lane.
    needs: changes
    if: ${{ needs.changes.outputs.lane == 'residential' }}
    # Pinned for Chromium, as the test job is.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # Application code and tests (`[tool.pyright]`, segments 22C, 22D); setup-python's
      # interpreter is on PATH, so pyright resolves the installed packages.
      - name: Type check
        run: pyright

      - name: Run the residential lane's tests
        env:
          RRW_REQUIRE_BROWSER: "1"
        run: |
          read -r -a targets <<< "$(python3 tools/ci_lanes.py --residential-tests)"
          pytest -n auto "${targets[@]}"
