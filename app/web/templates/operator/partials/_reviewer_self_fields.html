{# What reviewers see of their own entry (participant info), the Unlock
   panel's card. A linked session shows none (segment 23F: its roster
   tags are unused). #}
<section class="card" id="reviewer-self-fields"
         aria-labelledby="reviewer-self-fields-h"
         data-reviewer-self-card>
  <h2 id="reviewer-self-fields-h">What reviewers see of their own entry</h2>
  <form method="post" action="{{ url(reviewers_base_url) }}/self-fields"
        id="reviewer-self-fields-form" autocomplete="off">
    <div class="reviewer-self-chips">
      {% for chip in self_field_chips %}
        <label class="pill pill-count tag-chip">
          <input type="checkbox" class="visually-hidden"
                 name="fields" value="{{ chip.key }}"
                 {% if chip.selected %}checked{% endif %}>{{ chip.label }}</label>
      {% endfor %}
    </div>
    {% for key in self_field_kept %}
      <input type="hidden" name="keep" value="{{ key }}">
    {% endfor %}
    <div class="unlock-col-actions">
      <button type="button" class="btn secondary"
              data-reviewer-self-cancel disabled>Cancel</button>
      <button type="submit" class="btn secondary"
              data-reviewer-self-save disabled>Save</button>
    </div>
  </form>
  <script>
    (function () {
      var form = document.getElementById("reviewer-self-fields-form");
      if (!form) return;
      var saveBtn = form.querySelector("[data-reviewer-self-save]");
      var cancelBtn = form.querySelector("[data-reviewer-self-cancel]");
      var boxes = form.querySelectorAll('input[type="checkbox"]');
      var initial = Array.prototype.map.call(boxes, function (b) {
        return b.checked;
      });
      function refresh() {
        var dirty = Array.prototype.some.call(boxes, function (b, i) {
          return b.checked !== initial[i];
        });
        saveBtn.disabled = !dirty;
        cancelBtn.disabled = !dirty;
      }
      Array.prototype.forEach.call(boxes, function (b) {
        b.addEventListener("change", refresh);
      });
      cancelBtn.addEventListener("click", function () {
        Array.prototype.forEach.call(boxes, function (b, i) {
          b.checked = initial[i];
        });
        refresh();
      });
    })();
  </script>
</section>
