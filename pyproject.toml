[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "review-robin-web"
version = "0.1.0"
description = "Web-based structured review-cycle application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # GZipMiddleware skips zip archives and images only from 1.5
    # (cordware/spec/host.md, "Compression").
    "starlette>=1.5",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # 2.1 types Select and Result as segment 22C's pyright gate reads them.
    "sqlalchemy>=2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.5,<0.16",
    # Pinned exactly: a type-check gate must give the same answer on every
    # machine (segment 22C).
    "pyright==1.1.414",
    # Pinned to the minor whose Chromium build (1194) the web sandbox ships
    # preinstalled; CI downloads the same build. Bump both together.
    "playwright>=1.56,<1.57",
]

[tool.setuptools.packages.find]
include = ["app*", "cordware*", "residentialapps*", "utilityapps*"]

[tool.pytest.ini_options]
testpaths = ["tests", "cordware/tests", "residentialapps/tests", "utilityapps/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Segment 22H Item 1: ruff's defaults (double quotes, magic trailing
# commas respected, the line length above).

[tool.pyright]
# Strict mode (segment 22E) over application code and its tests (22C, 22D).
# Each root below turns off only the strict rules it still fails; a package
# joins strict mode when its list is gone, and test roots keep theirs for
# good. `reportPrivateUsage` is off: a package's modules share `_helpers`
# by convention (author's ruling, 2026-11-04). The first matching root wins.
include = ["app", "cordware", "residentialapps", "utilityapps", "tests"]
exclude = [".venv", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportPrivateUsage = "none"
# A `# type: ignore` hides nothing (segment 22F); a reasoned
# `# pyright: ignore[rule]` is the only way to silence a rule on a line.
enableTypeIgnoreComments = false
# Basic list/dict/set inference everywhere: strict inference is not a
# diagnostic, and it applies to installed libraries too, wherever they sit
# (Jinja's `globals` would infer strictly and 37 calls fail).
strictListInference = false
strictDictionaryInference = false
strictSetInference = false

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = [".", "tools"]
reportDeprecated = "none"
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"
reportPossiblyUnboundVariable = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnnecessaryComparison = "none"
reportUnusedFunction = "none"
reportUnusedImport = "none"
reportUnusedVariable = "none"

[[tool.pyright.executionEnvironments]]
root = "cordware/tests"
extraPaths = ["."]
reportDeprecated = "none"
reportIncompatibleMethodOverride = "none"
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnusedFunction = "none"

[[tool.pyright.executionEnvironments]]
root = "residentialapps/tests"
extraPaths = ["."]
reportMissingParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnusedImport = "none"

[[tool.pyright.executionEnvironments]]
root = "utilityapps/tests"
extraPaths = ["."]
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"

[[tool.pyright.executionEnvironments]]
root = "."

[tool.ruff.lint]
# Segment 22C rung 2: import order and modern syntax (2a), then bugbear
# and simplify (2b), on top of ruff's defaults (E4, E7, E9, F). E501 from
# segment 22H, once ruff format had wrapped what it could.
extend-select = ["I", "UP", "B", "SIM", "E501"]
ignore = [
    # StrEnum changes what str() and format() give for a member, which
    # templates and audit details render.
    "UP042",
    # zip(strict=True) raises where a short input is silently truncated
    # today: a behavior change at 42 call sites, not a lint fix.
    "B905",
    # Ternaries only where they read better; a style call, not a defect.
    "SIM108",
    # Its constant detection is by case, so it puts a test's expected
    # value on the left: the yoda form it means to remove.
    "SIM300",
    # A word list as "a b c".split() reads better than a long literal.
    "SIM905",
]

[tool.ruff.lint.per-file-ignores]
# The generator holds the theme customizer page's markup as long literals
# (author's ruling, segment 22H).
"tools/theme_customizer.gen.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter declarations, called in defaults by design.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Path",
    "fastapi.Query",
    # Frozen dataclasses: one shared default instance is safe.
    "app.services.extracts.zip_bundle.ByInstrumentOptions",
    "app.services.extracts.zip_bundle.MetadataOptions",
]

[tool.ruff.lint.isort]
# The repository's own alembic/ directory would otherwise make the
# installed package first-party.
known-third-party = ["alembic"]
