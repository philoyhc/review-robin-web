[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "review-robin-web"
version = "0.1.0"
description = "Web-based structured review-cycle application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # GZipMiddleware skips zip archives and images only from 1.5
    # (cordware/spec/host.md, "Compression").
    "starlette>=1.5",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # 2.1 types Select and Result as segment 22C's pyright gate reads them.
    "sqlalchemy>=2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.5,<0.16",
    # Pinned exactly: a type-check gate must give the same answer on every
    # machine (segment 22C).
    "pyright==1.1.414",
    # Pinned to the minor whose Chromium build (1194) the web sandbox ships
    # preinstalled; CI downloads the same build. Bump both together.
    "playwright>=1.56,<1.57",
]

[tool.setuptools.packages.find]
include = ["app*", "cordware*", "residentialapps*", "utilityapps*"]

[tool.pytest.ini_options]
testpaths = ["tests", "cordware/tests", "residentialapps/tests", "utilityapps/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
# Application code only; test code is checked by running it (segment 22C).
include = ["app", "cordware", "residentialapps", "utilityapps"]
exclude = [".venv", "**/__pycache__", "**/tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.ruff.lint]
# Segment 22C rung 2a: import order and modern syntax on top of ruff's
# defaults (E4, E7, E9, F). Not all of "E": E501 is 1,471 long lines with no
# formatter to fix them.
extend-select = ["I", "UP"]
# StrEnum changes what str() and format() give for a member, which
# templates and audit details render.
ignore = ["UP042"]

[tool.ruff.lint.isort]
# The repository's own alembic/ directory would otherwise make the
# installed package first-party.
known-third-party = ["alembic"]
